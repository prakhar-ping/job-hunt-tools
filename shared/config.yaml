# Job-hunt-tools config

model: claude-sonnet-4-6

# Email delivery (filled by user in real runs; --dry-run ignores these)
email:
  sender: jobhunter@example.com
  recipient: jobhunter@example.com

# Hybrid match: game-dev + transferable high-performance systems C++.
# Matching is WORD-BOUNDARY (so "engine" does NOT match "engineer").
# Rule: drop if any `exclude` term is in the title; else keep if any `title`
# term is in the title, OR (an engineering title AND a rare `desc_strong`
# term in the description).
match:
  title:          # any of these as a whole word in the TITLE => match
    # --- game-dev ---
    - c++
    - c#
    - game
    - gameplay
    - game engine
    - engine programmer
    - graphics
    - rendering
    - shader
    - unity
    - unreal
    - mobile
    - simulation
    - physics
    - netcode
    - multiplayer
    - tools programmer
    - client engineer
    # --- transferable systems C++ ---
    - performance
    - optimization
    - systems engineer
    - distributed
    - storage engine
    - query engine
    - kernel
    - database
    - low latency
    - low-latency
  desc_strong:    # rare; counts in description only on an engineering title
    - lua
    - opengl
    - vulkan
    - directx
    - memory allocator
    - object pooling
    - entity component
    - frame rate
    - cache-friendly
    - modern c++
    - lock-free
    - rocksdb
    - raft
  exclude:        # drop if any appear as a whole word in the title
    - sales
    - account executive
    - account manager
    - recruiter
    - marketing
    - legal
    - intern
    - artist
    - animator
    - designer            # Game/UX/Level Designer — not a programming role
    - art                 # Art Lead / Art Director / Concept Art
    - production          # Game Production / Director of Production
    - technical artist
    - qa
    - producer
    - narrative
    - insights
    - research scientist
    - data scientist
    - community manager
    - product manager
    - product design
    - solutions architect
    - pre-sales
    - presales
    - support engineer
    - customer success
    - sound

# Web-wide aggregator (Adzuna). Activates when ADZUNA_APP_ID + ADZUNA_APP_KEY
# are set in .env. Results are normalized, deduped, then run through the SAME
# match filter above, and diffed/emailed like a company called "Web (Adzuna)".
aggregator:
  enabled: true
  provider: adzuna
  countries: [in, us, gb]      # ISO codes to search (Adzuna is country-scoped)
  queries:
    - "C++ game developer"
    - "gameplay programmer"
    - "game engine C++"
    - "engine programmer"
    - "C++ graphics engineer"
  results_per_page: 50
  max_days_old: 30

# ATS map. type: greenhouse | lever | unsupported
# Greenhouse: token -> boards-api.greenhouse.io/v1/boards/<token>/jobs
# Lever:      token -> api.lever.co/v0/postings/<token>
companies:
  # --- game studios (match the resume) ---
  Riot:          {type: greenhouse, token: riotgames}
  Epic:          {type: greenhouse, token: epicgames}
  Roblox:        {type: greenhouse, token: roblox}
  Rockstar:      {type: greenhouse, token: rockstargames}
  Bungie:        {type: greenhouse, token: bungie}
  "Naughty Dog": {type: greenhouse, token: naughtydog}
  Unity:         {type: greenhouse, token: unity3d}
  Scopely:       {type: greenhouse, token: scopely}
  Wooga:         {type: greenhouse, token: wooga}
  Voodoo:        {type: lever, token: voodoo}
  # --- storage / database (transferable high-perf C++) ---
  Rubrik:        {type: greenhouse, token: rubrik}
  MongoDB:       {type: greenhouse, token: mongodb}
  Druva:         {type: greenhouse, token: druva}
  "Pure Storage": {type: greenhouse, token: purestorage}
  ClickHouse:    {type: greenhouse, token: clickhouse}
  Couchbase:     {type: greenhouse, token: couchbaseinc}
  # --- no public ATS API wired yet (listed with careers link each run) ---
  Cohesity:      {type: unsupported, careers: "https://www.cohesity.com/company/careers/"}
  Nutanix:       {type: unsupported, careers: "https://nutanix.eightfold.ai/careers"}
  NetApp:        {type: unsupported, careers: "https://careers.netapp.com/"}
  VMware:        {type: unsupported, careers: "https://careers.broadcom.com/"}
  Confluent:     {type: unsupported, careers: "https://careers.confluent.io/"}
  Arista:        {type: unsupported, careers: "https://www.arista.com/en/careers"}
  Playrix:       {type: unsupported, careers: "https://playrix.com/vacancies/"}
