# Job-hunt-tools config

# LLM for resume tailoring, referral drafts, and resume->keyword derivation.
# provider: ollama (local, free) | anthropic (paid, needs ANTHROPIC_API_KEY)
llm:
  provider: ollama
  model: llama3.1:8b
  ollama_host: http://localhost:11434

# Email delivery (filled by user in real runs; --dry-run ignores these)
email:
  sender: jobhunter@example.com
  recipient: jobhunter@example.com

# Hybrid match: game-dev + transferable high-performance systems C++.
# Matching is WORD-BOUNDARY (so "engine" does NOT match "engineer").
# Rule: drop if any `exclude` term is in the title; else keep if any `title`
# term is in the title, OR (an engineering title AND a rare `desc_strong`
# term in the description).
match:
  title:          # any of these as a whole word in the TITLE => match
    # --- game-dev ---
    - c++
    - c#
    - game
    - game developer
    - gameplay
    - game engine
    - engine programmer
    - graphics
    - rendering
    - shader
    - unity
    - unreal
    - mobile
    - simulation
    - physics
    - netcode
    - multiplayer
    - tools programmer
    - client engineer
    # --- c++ / distributed systems ---
    - c++ engineer
    - c++ developer
    - performance
    - optimization
    - systems engineer
    - distributed
    - distributed system
    - distributed systems
    - distributed systems engineer
    - storage engine
    - query engine
    - kernel
    - database
    - low latency
    - low-latency
  desc_strong:    # rare; counts in description only on an engineering title
    - lua
    - opengl
    - vulkan
    - directx
    - memory allocator
    - object pooling
    - entity component
    - frame rate
    - cache-friendly
    - modern c++
    - lock-free
    - rocksdb
    - raft
    - distributed computing
    - microservices
  exclude:        # drop if any appear as a whole word in the title
    - sales
    - account executive
    - account manager
    - recruiter
    - marketing
    - legal
    - intern
    - artist
    - animator
    - designer            # Game/UX/Level Designer — not a programming role
    - art                 # Art Lead / Art Director / Concept Art
    - production          # Game Production / Director of Production
    - technical artist
    - qa
    - producer
    - narrative
    - insights
    - research scientist
    - data scientist
    - community manager
    - product manager
    - product design
    - solutions architect
    - pre-sales
    - presales
    - support engineer
    - customer success
    - sound

# Web-wide aggregator (Adzuna). Activates when ADZUNA_APP_ID + ADZUNA_APP_KEY
# are set in .env. Results are normalized, deduped, then run through the SAME
# match filter above, and diffed/emailed like a company called "Web (Adzuna)".
aggregator:
  enabled: true
  provider: adzuna
  countries: [in, us, gb]      # ISO codes to search (Adzuna is country-scoped)
  queries:
    - "C++ game developer"
    - "gameplay programmer"
    - "game engine C++"
    - "engine programmer"
    - "C++ graphics engineer"
    - "C++ distributed systems engineer"
    - "distributed systems C++"
  results_per_page: 50
  max_days_old: 30

